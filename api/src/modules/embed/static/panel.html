<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Groundwork</title>
<style>
  :root { --ink:#1b1a18; --sub:#5a544c; --line:#e2ddd5; --bg:#f4f2ee; --navy:#1C4E80; }
  * { box-sizing:border-box }
  body { margin:0; font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:#fff; display:flex; flex-direction:column; height:100vh }
  header { padding:10px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:8px }
  .who { font-weight:700; font-size:13px }
  .fresh { font-size:11px; color:var(--sub) }
  .fresh.stale { color:#8A5C1A }
  .acts { display:flex; align-items:center; gap:6px }
  #close { border:0; background:none; font-size:18px; color:var(--sub); cursor:pointer; line-height:1 }
  #log { flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px }
  .msg { max-width:88%; padding:9px 12px; border-radius:12px; white-space:pre-wrap; font-size:13.5px }
  .them { background:var(--bg); align-self:flex-start; border-bottom-left-radius:4px }
  .me { background:var(--navy); color:#fff; align-self:flex-end; border-bottom-right-radius:4px }
  .chips { display:flex; flex-wrap:wrap; gap:6px }
  .chip { font-size:12px; padding:5px 10px; border-radius:14px; border:1px solid var(--line); background:#fff; cursor:pointer; font-family:inherit }
  .chip:hover { background:var(--bg) }
  .chip.act { background:var(--navy); color:#fff; border-color:var(--navy); font-weight:600 }
  .chip.act:hover { background:#173f68 }
  #pin[aria-pressed=true] { background:var(--bg) }
  .card { background:var(--bg); border-radius:12px; padding:10px 12px; font-size:13px; align-self:stretch }
  .card b { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--sub); margin-bottom:4px }
  .by { font-size:10.5px; color:var(--sub); align-self:flex-start; margin-top:-6px }
  form { display:flex; gap:6px; padding:10px 12px; border-top:1px solid var(--line) }
  input { flex:1; font:inherit; font-size:13.5px; padding:8px 10px; border:1px solid var(--line); border-radius:8px }
  button[type=submit] { border:0; background:var(--navy); color:#fff; border-radius:8px; padding:0 14px; font:inherit; font-weight:600; cursor:pointer }
</style>
</head>
<body>
  <header>
    <div>
      <div class="who" id="who">Groundwork</div>
      <div class="fresh" id="fresh"></div>
    </div>
    <div class="acts">
      <button id="seen" type="button" class="chip">What you can see</button>
      <button id="pin" type="button" class="chip" aria-pressed="false" title="Keep this open on the side">Pin</button>
      <button id="close" aria-label="Close">×</button>
    </div>
  </header>
  <div id="log" role="log" aria-live="polite"></div>
  <form id="form"><input id="input" placeholder="Ask about your work" autocomplete="off"><button type="submit">Send</button></form>

<script>
/**
 * THE PANEL. It holds the session token and speaks to the API; the host page can do neither.
 *
 * The token arrives in the fragment rather than the query string, because a fragment is never sent
 * to a server and never lands in an access log - not ours, not a proxy's, not the customer's. It is
 * read once and removed from the address so it does not sit in the frame's history either.
 */
(function () {
  var API = location.origin;
  var token = decodeURIComponent(location.hash.slice(1));
  history.replaceState(null, '', location.pathname);

  /**
   * THE SESSION LASTS FIFTEEN MINUTES AND NOTHING USED TO RENEW IT.
   *
   * The service's own comment said "refreshed silently by the widget" and the guard's refusal said
   * "the panel will reconnect", and neither existed: after fifteen minutes every call failed and the
   * person got "I could not reach the record just then" for good, until somebody reloaded the page
   * the panel was sitting on. A conversation that stops working mid-sentence, with a sentence that
   * blames the network.
   *
   * Only the host page can get a new one — the session comes from the customer's own signed
   * identity token, which we cannot ask for from in here. So we ask, and it hands one back.
   *
   * ASKED FOR EARLY, and retried once on a refusal. Waiting for the 401 means somebody's message
   * fails first; asking at twelve minutes means they never notice.
   */
  var SESSION_LASTS_MS = 15 * 60 * 1000;
  var ASK_AFTER_MS = 12 * 60 * 1000;
  var waitingForSession = null;

  function askForANewSession() {
    if (waitingForSession) return waitingForSession;
    send('needs-session');
    waitingForSession = new Promise(function (resolve) {
      var done = false;
      var settle = function (ok) {
        if (done) return;
        done = true;
        waitingForSession = null;
        resolve(ok);
      };
      window.__gwSessionArrived = function () { settle(true); };
      /* If the host never answers — an old embed.js that does not know the message, or a page that
         has gone away — stop waiting rather than hanging every call behind it. */
      setTimeout(function () { settle(false); }, 8000);
    });
    return waitingForSession;
  }

  setInterval(askForANewSession, ASK_AFTER_MS);
  void SESSION_LASTS_MS;

  /**
   * Every call to us goes through here, so a session that expired is a pause rather than a dead
   * panel. One retry: if the new session does not work either, the problem is not the session.
   */
  function withSession(run) {
    return run(token).then(function (r) {
      if (r.status !== 401) return r;
      return askForANewSession().then(function (got) {
        if (!got) return r;
        return run(token);
      });
    });
  }

  var log = document.getElementById('log');
  var form = document.getElementById('form');
  var input = document.getElementById('input');

  function send(type, extra) {
    parent.postMessage(Object.assign({ type: type }, extra || {}), '*');
  }

  function bubble(cls, textContent) {
    var d = document.createElement('div');
    d.className = 'msg ' + cls;
    /* textContent, never innerHTML. Everything here has passed through a customer's systems. */
    d.textContent = textContent;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  /*
   * A CHIP EITHER SAYS SOMETHING OR DOES SOMETHING. A plain chip sends its label as if typed. A
   * chip with an `act` runs that act against the check-in routes: it is how "Start it" starts the
   * check-in here, in this box, rather than printing a link into the product.
   */
  function chips(options) {
    var wrap = document.createElement('div');
    wrap.className = 'chips';
    options.forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = o.act ? 'chip act' : 'chip';
      b.textContent = o.label;
      b.addEventListener('click', function () {
        if (o.act) act(o.act);
        else ask(o.label);
      });
      wrap.appendChild(b);
    });
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  function api(method, path, body) {
    return withSession(function (t) {
      var init = { method: method, headers: { Authorization: 'Bearer ' + t } };
      if (body !== undefined) {
        init.headers['Content-Type'] = 'application/json';
        init.body = JSON.stringify(body);
      }
      return fetch(API + '/api/org/v1' + path, init);
    });
  }

  /*
   * THE PANEL TELLS THE TRUTH ABOUT WHAT HAPPENED.
   *
   * Four calls did `r.ok ? r.json() : null`, which collapses every refusal into "try again in a
   * moment" - including the billing wall, a legal hold and an already-complete check-in, none of
   * which trying again can fix - and one call did not check at all, so a refusal rendered as
   * nothing. The server writes a sentence for every refusal; this reads it.
   */
  function refusalFrom(r, fallback) {
    return r.json().then(function (b) {
      var m = b && b.message;
      if (Array.isArray(m)) m = m.join(' ');
      return (typeof m === 'string' && m.trim()) ? m : fallback;
    }).catch(function () { return fallback; });
  }

  /*
   * ONE THING IN FLIGHT AT A TIME. The composer fired as often as return was pressed and the
   * "Start it" chip had no lock, so five presses against a slow model were five sessions opened -
   * and five decrements. While a call is out, the input and every acting chip are disabled.
   */
  var busy = false;
  function setBusy(on) {
    busy = on;
    input.disabled = on;
    Array.prototype.forEach.call(document.querySelectorAll('.chip.act'), function (b) { b.disabled = on; });
    if (!on) input.focus();
  }

  /*
   * THE CHECK-IN RUNS IN THE PANEL.
   *
   * The routes to open, answer and complete a check-in existed and the panel never called them, so a
   * member's check-in was a link to the product. While `inCheckIn` is set, what they type goes to
   * the check-in and not to the assistant; it clears when the session completes or fails to open.
   */
  var inCheckIn = null;
  /* A ground waiting on this person to start: the next thing they type is their part in it. */
  var awaitingPartFor = null;

  function confirmWithPart(groundId, part) {
    awaitingPartFor = null;
    input.placeholder = 'Ask about your work';
    bubble('me', part);
    api('POST', '/grounds/' + encodeURIComponent(groundId) + '/confirm-lead', { remit: part })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (o) {
        bubble('them', o ? 'Started. Your first check-in is open when you are ready.' : 'I could not start it just then. Try again in a moment.');
        if (typeof window.__gwDrawOpening === 'function') window.__gwDrawOpening();
      })
      .catch(function () { bubble('them', 'I could not start it just then. Try again in a moment.'); });
  }

  function act(a) {
    if (a.kind === 'open_a_check_in') return startCheckIn(a.id);
    if (a.kind === 'confirm_a_check_in') return readAndConfirm(a.id);
  }

  function startCheckIn(id) {
    if (busy) return;
    setBusy(true);
    api('POST', '/check-ins/' + encodeURIComponent(id) + '/open')
      .then(function (r) {
        /* A refusal here is usually the billing wall, which trying again cannot fix. Print its sentence. */
        if (!r.ok) return refusalFrom(r, 'I could not open that check-in just then. Try again in a moment.').then(function (said) { bubble('them', said); return null; });
        return r.json();
      })
      .then(function (o) {
        if (!o) return;
        if (!o.reply) { bubble('them', 'I could not open that check-in just then. Try again in a moment.'); return; }
        inCheckIn = id;
        input.placeholder = 'Answer here';
        bubble('them', o.reply);
      })
      .catch(function () { bubble('them', 'I could not open that check-in just then. Try again in a moment.'); })
      .then(function () { setBusy(false); });
  }

  /* Said once, by the person, in a word. Completion is irreversible, so the panel never does it for them. */
  var FINISH_WORD = /^\s*(finish|complete|done|close)\s*[.!]?\s*$/i;

  function answerInCheckIn(message) {
    var id = inCheckIn;
    if (busy) return;
    bubble('me', message);
    setBusy(true);
    api('POST', '/check-ins/' + encodeURIComponent(id) + '/messages', { content: message })
      .then(function (r) {
        /* The answer ceiling, a legal hold and a network fault are three different sentences. */
        if (!r.ok) return refusalFrom(r, 'I could not reach the record just then. Say that again in a moment.').then(function (said) { bubble('them', said); return null; });
        return r.json();
      })
      .then(function (o) {
        if (!o) return;
        if (!o.reply) { bubble('them', 'I could not reach the record just then. Say that again in a moment.'); return; }
        bubble('them', o.reply);
        /*
         * NOT finishCheckIn(id). The panel auto-completed the moment the engine said the session
         * could close, and completion is irreversible. WhatsApp asks first; so does this.
         */
        if (o.sessionComplete) bubble('them', 'That is enough to close this check-in. Say "finish" to complete it, or keep going.');
      })
      .catch(function () { bubble('them', 'I could not reach the record just then. Say that again in a moment.'); })
      .then(function () { setBusy(false); });
  }

  /*
   * NEVER "THAT IS DONE" WHEN IT IS NOT. This cleared the check-in and the placeholder BEFORE the
   * network call, then mapped the response and threw it away - so a refused completion (a thin
   * record, which the server refuses with canContinue: true) was announced as done and the person
   * was typing to the assistant about a session that was still open. The state changes only when
   * the server says it did.
   */
  function finishCheckIn(id) {
    if (busy) return;
    setBusy(true);
    api('POST', '/check-ins/' + encodeURIComponent(id) + '/complete')
      .then(function (r) {
        if (r.ok) return r.json().then(function () { return 'completed'; });
        return r.json().catch(function () { return {}; }).then(function (b) {
          var said = b && b.message; if (Array.isArray(said)) said = said.join(' ');
          if (r.status === 400 && b && b.canContinue) {
            /* Still open, and still theirs to finish: the server said what it needs first. */
            bubble('them', (typeof said === 'string' && said) || 'A little more is needed before this can close. Answer one or two more questions, then say finish.');
          } else {
            bubble('them', 'Your check-in is still open. ' + ((typeof said === 'string' && said) || 'It could not be completed just then; try again in a moment.'));
          }
          return 'refused';
        });
      })
      .then(function (outcome) {
        if (outcome !== 'completed') return;
        inCheckIn = null;
        input.placeholder = 'Ask about your work';
        return api('GET', '/check-ins/' + encodeURIComponent(id) + '/report')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (s) {
            var report = s && s.report;
            if (!report) { bubble('them', 'That is done. Your report is being put together and will be here when it is ready.'); }
            else showReport(report);
            /* The badge and the first line are about what is due, and something just stopped being due. */
            if (typeof window.__gwDrawOpening === 'function') window.__gwDrawOpening();
          })
          .catch(function () { bubble('them', 'That is done. I could not fetch the report just then; ask me for it in a moment.'); });
      })
      .catch(function () { bubble('them', 'Your check-in is still open. I could not reach the record just then; try again in a moment.'); })
      .then(function () { setBusy(false); });
  }

  /* The session report, as the app shows it under the transcript: where things stand, the reads at a glance, the one conversation worth having. */
  function showReport(report) {
    var card = document.createElement('div');
    card.className = 'card';
    var lines = [];
    if (report.whereThingsStand && report.whereThingsStand.saying) lines.push(report.whereThingsStand.saying);
    (report.atAGlance || []).forEach(function (g) { lines.push(g.label + ': ' + g.value + (g.sub ? ' (' + g.sub + ')' : '')); });
    if (report.theConversationWorthHaving) lines.push('Worth having: ' + report.theConversationWorthHaving);
    var head = document.createElement('b');
    head.textContent = report.state === 'final' ? 'Your report' : 'Your report so far';
    card.appendChild(head);
    card.appendChild(document.createTextNode(lines.join('\n')));
    card.style.whiteSpace = 'pre-wrap';
    log.appendChild(card);
    log.scrollTop = log.scrollHeight;
  }

  /* A ground set up for this person as lead: show what was written for them, then one chip that confirms it. */
  function readAndConfirm(groundId) {
    api('GET', '/grounds/awaiting-me')
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (list) {
        var g = (list || []).filter(function (x) { return x.groundId === groundId; })[0];
        if (!g) { bubble('them', 'That one has already started, or is no longer waiting on you.'); return; }
        bubble('them', (g.brief ? 'What was written for you: "' + g.brief + '"\n\n' : '') + g.says);
        /*
         * THEIR OWN PART, ASKED ONCE, BEFORE IT STARTS. The role map, the coaching read and the
         * probe list all key on it, and a lead confirmed from the panel used to arrive with none:
         * 0 of 2 API-set leads had one. One sentence, sent as the remit with the confirmation.
         */
        bubble('them', 'And your part in this, in a sentence? Type it and send, and this starts.');
        awaitingPartFor = groundId;
        input.placeholder = 'Your part in this';
        input.focus();
      })
      .catch(function () { bubble('them', 'I could not read that just then. Try again in a moment.'); });
  }

  function render(reply) {
    (reply.blocks || []).forEach(function (b) {
      if (b.type === 'text') bubble('them', b.body);
      else if (b.type === 'picker') chips(b.options || []);
      else if (b.type === 'next_step' && (b.kind === 'open_a_check_in' || b.kind === 'confirm_a_check_in') && b.id) {
        /* An act on a record, done here. It used to print "[next_step]", which is a link to the product with the link removed. */
        chips([{ label: b.label, act: { kind: b.kind, id: b.id } }]);
      } else if (b.type === 'proposal' && b.summary) bubble('them', b.summary);
      else if (b.type !== 'next_step') bubble('them', '[' + b.type + ']');
    });
    /* Stamped on every reply, so a person always knows which spoke. */
    if (reply.composedBy === 'rules') {
      var by = document.createElement('div');
      by.className = 'by';
      by.textContent = 'answered from your records';
      log.appendChild(by);
    }
  }

  function ask(message) {
    if (busy) return;
    bubble('me', message);
    setBusy(true);
    withSession(function (t) {
      return fetch(API + '/api/org/v1/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + t },
        body: JSON.stringify({ message: message }),
      });
    })
      .then(function (r) {
        /* This never checked the status: a refusal body has no blocks, so render() printed nothing at all. */
        if (!r.ok) return refusalFrom(r, 'I could not reach the record just then. Try again in a moment.').then(function (said) { bubble('them', said); return null; });
        return r.json();
      })
      .then(function (reply) { if (reply) render(reply); })
      .catch(function () {
        /* Never a stack trace, and never silence. */
        bubble('them', 'I could not reach the record just then. Try again in a moment.');
      })
      .then(function () { setBusy(false); });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = input.value.trim();
    if (!v) return;
    input.value = '';
    if (awaitingPartFor) confirmWithPart(awaitingPartFor, v);
    else if (inCheckIn && FINISH_WORD.test(v)) { bubble('me', v); finishCheckIn(inCheckIn); }
    else if (inCheckIn) answerInCheckIn(v);
    else ask(v);
  });

  /*
   * PIN. The loader owns where the frame sits, so the panel only says what was asked; the loader
   * docks it and remembers, and answers with the state so the button reads right after a reload.
   */
  var pinBtn = document.getElementById('pin');
  pinBtn.addEventListener('click', function () {
    var pinned = pinBtn.getAttribute('aria-pressed') !== 'true';
    pinBtn.setAttribute('aria-pressed', pinned ? 'true' : 'false');
    pinBtn.textContent = pinned ? 'Unpin' : 'Pin';
    send('pin', { pinned: pinned });
  });

  /*
   * WHAT IT CAN SEE, SHOWN RATHER THAN PROMISED.
   *
   * Every answer cites where it came from; this is the place a person can go and
   * look at the material itself, including what the bound left out. It renders
   * from one route and holds no idea of its own about what is known.
   */
  document.getElementById('seen').addEventListener('click', function () {
    withSession(function (t) {
      return fetch(API + '/api/org/v1/assistant/what-you-can-see', { headers: { Authorization: 'Bearer ' + t } });
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (s) {
        if (!s) { bubble('them', 'I could not read that just then. Try again in a moment.'); return; }
        var lines = ['Here is everything I am working from.'];
        (s.groups || []).forEach(function (g) {
          lines.push('');
          lines.push(g.what + ' (' + g.howMany + ', from ' + g.from + ')');
          if (!g.each.length) lines.push('- nothing');
          g.each.forEach(function (e) { lines.push('- ' + e); });
        });
        if (s.leftOut && s.leftOut.length) {
          lines.push('');
          lines.push('Left out, because I read at most ' + s.mostOfEach + ' of each: ' + s.leftOut.join(', ') + '.');
        }
        bubble('them', lines.join('\n'));
      })
      .catch(function () { bubble('them', 'I could not read that just then. Try again in a moment.'); });
  });

  document.getElementById('close').addEventListener('click', function () { send('closed'); });

  /* Two inbound, and neither carries content. */
  window.addEventListener('message', function (e) {
    if (!e.data || e.source !== parent) return;
    if (e.data.type === 'session' && typeof e.data.token === 'string' && e.data.token) {
      /* Only from the page we are embedded in, checked above. A bogus token from anywhere else
         would simply fail to authenticate, but there is no reason to hold one. */
      token = e.data.token;
      if (window.__gwSessionArrived) window.__gwSessionArrived();
    } else if (e.data.type === 'open') input.focus();
    else if (e.data.type === 'pinned') {
      pinBtn.setAttribute('aria-pressed', e.data.pinned ? 'true' : 'false');
      pinBtn.textContent = e.data.pinned ? 'Unpin' : 'Pin';
      pinBtn.hidden = e.data.pinned === null;
    }
    else if (e.data.type === 'context' && e.data.subjectExternalId) {
      var next = String(e.data.subjectExternalId);
      var changed = window.__gwContext !== next;
      window.__gwContext = next;
      /* A host that calls context() as the person navigates is telling us they have moved. Drawing
         the opening for the page they have left is worse than drawing none. */
      if (changed && typeof window.__gwDrawOpening === 'function') window.__gwDrawOpening();
    }
  });

  /*
   * THE OPENING, AND WHAT THE HOST SAID THE PERSON IS LOOKING AT.
   *
   * `__gwContext` was written by the message handler above and read by nothing, so
   * `groundwork.context({ subjectExternalId })` — which a customer's page is documented to call —
   * did nothing at all. It is passed here, where it decides what the panel opens on, and nowhere
   * else: a page's idea of context has no business in what somebody is recorded as having said.
   */
  window.__gwDrawOpening = function () {
  /*
   * THROUGH `withSession`, LIKE EVERY OTHER CALL.
   *
   * It used to run exactly once, at load, on a session seconds old — which is why it was the one
   * fetch allowed to reach for `token` directly. It can now be redrawn when the host tells us the
   * person has navigated, which may be an hour later on a session that has run out. Caught by the
   * guard that counts wrapped calls against total calls, which is exactly what that guard is for.
   */
  withSession(function (t) {
    var openingUrl = API + '/api/org/v1/embed/opening'
      + (window.__gwContext ? '?about=' + encodeURIComponent(window.__gwContext) : '');
    return fetch(openingUrl, { headers: { Authorization: 'Bearer ' + t } });
  })
    .then(function (r) { return r && r.ok ? r.json() : null; })
    .then(function (s) {
      if (!s) {
        /*
         * A FAILED OPENING IS NOT AN EMPTY PANEL.
         *
         * This returned early, so a panel whose opening call failed drew nothing — identical, from
         * the outside, to being deliberately out of scope and to a broken install. Somebody sat
         * looking at an empty box with a text field.
         */
        bubble('them', 'I could not read your record just then. Ask me something and I will try again.');
        send('ready');
        return;
      }
      document.getElementById('who').textContent = s.person ? s.person.displayName : 'Groundwork';
      var fresh = document.getElementById('fresh');
      if (s.freshness && s.freshness.length) {
        var stale = s.freshness.filter(function (f) { return f.stale; });
        fresh.textContent = stale.length
          ? stale[0].system + ' has not sent anything recently'
          : s.freshness.map(function (f) { return f.system; }).join(', ') + ' connected';
        if (stale.length) fresh.className = 'fresh stale';
      }
      /* The badge is the count of things only this person can move. Zero clears it. */
      send('badge', { count: s.due && s.due.count ? Number(s.due.count) : 0 });
      if (s.opening) {
        bubble('them', s.opening.line);
        var options = (s.opening.acts || []).map(function (a) { return { label: a.label, act: { kind: a.kind, id: a.id } }; })
          .concat((s.opening.suggestions || []).map(function (t) { return { key: t, label: t }; }));
        if (options.length) chips(options);
      }
      send('ready');
      send('resize', { height: Math.min(document.body.scrollHeight, 640) });
    })
    .catch(function () {
      /* Same rule on a thrown request as on a refused one: never an empty panel. */
      bubble('them', 'I could not read your record just then. Ask me something and I will try again.');
      send('ready');
    });
  };

  window.__gwDrawOpening();
})();
</script>
