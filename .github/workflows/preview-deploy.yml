name: Preview Deploy (Vercel)

# WHY THIS EXISTS.
#
# Vercel's Git integration checks whether the commit author has
# "contributing access" to the project on Vercel before it will build a
# preview. On the Hobby plan, private repositories can't grant that access
# to anyone but the project owner - so every PR from another contributor
# gets a hard "Deployment Blocked" instead of a preview.
#
# This workflow sidesteps that check entirely: it deploys through the
# Vercel CLI using an owner-held API token, so the deployment is
# authenticated by token rather than by git commit author. Contributors get
# a real preview URL regardless of who's on the Vercel team.
on:
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/preview-deploy.yml"

concurrency:
  # Shared with staging-deploy.yml: both hit the same Vercel project/token,
  # and the Hobby plan allows only one concurrent build. Without a shared
  # group, a merge that fires both workflows at once leaves one deploy
  # queued server-side on Vercel with no client-side timeout, until this
  # job's own 15-minute timeout kills it.
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Build and deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy.outputs.url }}";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview deployed: ${url}`,
            });
