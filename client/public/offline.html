<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#FDFBF6" />
<meta name="robots" content="noindex, nofollow" />
<title>Groundwork · You're offline</title>
<style>
  /*
    SELF-CONTAINED ON PURPOSE (B-113). This page is served by the service worker when a real
    navigation cannot reach the network at all, so it cannot assume the app's own stylesheet, fonts
    or build ever loaded - it has to carry everything it needs inline. The colours below are copied
    from client/src/index.css's tokens (--color-background, --color-gw-navy, --color-gw-text,
    --color-gw-sub, --color-gw-border) rather than linked, for the same reason.
  */
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #FDFBF6; /* --color-background */
    color: #1A1916; /* --color-gw-text */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 380px;
    width: 100%;
    text-align: center;
  }
  .mark {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 28px;
    color: #0C447C; /* --color-gw-navy */
    font-weight: 700;
    font-size: 18px;
  }
  h1 {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
    color: #1A1916; /* --color-gw-text */
  }
  p {
    font-size: 14.5px;
    line-height: 1.65;
    color: #4E4236; /* --color-gw-sub */
    margin: 0 0 22px;
  }
  button {
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    background: #0C447C; /* --color-gw-navy */
    color: #FDFBF6;
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    min-height: 44px;
    cursor: pointer;
  }
  button:hover { background: #042C53; /* --color-gw-navy-d */ }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="mark" aria-hidden="true">
        <svg width="22" height="17" viewBox="0 0 22 17" xmlns="http://www.w3.org/2000/svg">
          <rect x="5" y="0" width="12" height="3" rx="1.5" fill="currentColor" opacity="0.45" />
          <rect x="2" y="6" width="18" height="3" rx="1.5" fill="currentColor" opacity="0.72" />
          <rect x="0" y="12" width="22" height="3" rx="1.5" fill="currentColor" />
        </svg>
        <span>Groundwork</span>
      </div>
      <h1>You're offline</h1>
      <p>Groundwork will open again when you're back online.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </div>
  </div>
</body>
</html>
